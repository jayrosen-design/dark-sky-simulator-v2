[project]
name = "dark-sky-simulator"
version = "2.0.0"
description = "Dark Sky Simulator v2.0 offline pipeline: Garstang-lite engine, public-data ingestion, basis-layer precompute"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pyyaml>=6.0",
  "requests>=2.32",
  "shapely>=2.0",
  "tifffile>=2024.5",
]

[project.optional-dependencies]
viirs = ["earthengine-api>=1.0"]
ml = ["lightgbm>=4.3", "scikit-learn>=1.5"]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "ingest", "pipeline", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
