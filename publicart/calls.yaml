# Calls to artists for public art (Funding tab of the Public Art Policy Simulator)
#
# CURATED BY HAND, not pulled from a feed: there is no open national listing. CaFE (callforentry.org, Creative West)
# forbids automated access in its terms and NYFA blocks automated requests, so neither is read; the Funding tab
# links to them instead (linkouts below). Every call here was checked on source_url: the commissioning body, a public
# agency or arts council, a university, or the nonprofit running the call. Values the source does not state are null;
# inferred values (a deadline year, an end-of-month date) are flagged in notes.
#
# Compiled 2026-10-05: 31 calls open on or after that date (8 in Florida, 23 elsewhere). No commission was open in
# Gainesville or Alachua County; the County's rolling art-loan program is listed as `other`.
# budget_usd is the published figure; where it is per artist, per unit or per future project, budget_note says so.
# The app hides calls once their deadline passes. Add new calls in the same format and rebuild:
#   python -m publicart.grants
#
# kind: commission | rfq | rfp | mural | temporary | residency | other

linkouts:
  - label: "CaFÉ call listings (Creative West)"
    url: "https://opportunities.wearecreativewest.org/"
    note: "The largest US listing of public art calls; linked, not read (its terms forbid automated access)"
  - label: "CODAworx RFPs"
    url: "https://www.codaworx.com/rfps/"
  - label: "NYFA classifieds"
    url: "https://www.nyfa.org/"
  - label: "Florida Art in State Buildings calls"
    url: "https://dos.fl.gov/cultural/programs/art-in-state-buildings/calls-to-artists/"
  - label: "Florida arts opportunities"
    url: "https://dos.fl.gov/cultural/info-and-opportunities/jobs-and-opportunities/find-an-opportunity/"

