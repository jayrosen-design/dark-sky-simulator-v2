# Public art registry, part 2: works listed in the Public Art Archive for Alachua County, Florida
#
# Source: Public Art Archive, a publication of Creative West (https://publicartarchive.org). Imported on 2026-10-04
# from the archive's public search (all records within 60 miles of Gainesville, kept if inside Alachua County):
# 133 records, 129 entries here, 3 merged into registry.yaml (their entries now cite the
# archive record), 1 skipped (c3e89f69: umbrella record for Light Abacus 1, 2 and 3; parts 2 and 3 have their own records).
#
# FACTS ONLY, each linked to its archive record (source_url): title, artist, year, building, address, the archive's
# coordinates, and collection/owner. The archive's descriptions and images are not copied; see each record for them
# and for credits. The archive's terms allow non-commercial research use with citation; this simulator relies on that
# and on fair use for facts. The archive does not warrant its records' accuracy, and neither does this file.
#
# Coded by hand from each record (the archive has no such fields):
# - setting: outdoor | indoor | unverified. Outdoor or indoor only when the record states or clearly implies it (or
#   OpenStreetMap maps the work outdoors); `notes` says which. "unverified" works are treated as indoor: they count
#   for the collection and walking access but get no street impressions and no 3D model. Change a work to outdoor
#   once someone has checked it on site.
# - type and material: the nearest of the simulator's classes (aluminum counts as steel; ceramic tile as mosaic).
#   Flat ground-level works (pavement or pool mosaics) are coded as a 'wall' 5-10 cm high.
# - status: off_view where the archive marks a work off view; removed where the record says it is gone.
# - provenance: uf for UF and UF Health collections (mostly Florida's Art in State Buildings program at UF),
#   municipal for the City and GRU, county for Alachua County, private for the Marilyn A. Wall Foundation.
# Settings in this import: 18 outdoor, 76 indoor, 35 unverified.

