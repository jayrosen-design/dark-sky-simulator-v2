# Public Art Policy Simulator assumptions. Every value is editable in the app and carries its source. "Assumption"
# means a planning default to be replaced by local data (a conservator survey, staff figures, counts); it is not a
# finding. Policy values quote Gainesville Code Chapter 5.5 (1989) or the Art in Public Places Trust discussion
# draft (handout of Aug 31, 2026); the draft is not adopted law.

policy:
  allocation_rate: {value: 0.01, provenance: "Ch. 5.5-3(c): each appropriation shall include at least one percent of the total construction budget"}
  cap_1989: {value: 100000, provenance: "Ch. 5.5-3(c): the total appropriation from any single project shall not exceed $100,000 (1989)"}
  cap_draft: {value: 300000, low: 100000, high: 500000, provenance: "Trust discussion draft, Aug 31 2026: raise the single-project cap to $300,000"}
  index_first_fy: {value: 2028, provenance: "Draft: beginning October 1, 2027 (the start of City FY2028) and annually thereafter, adjusted by CPI-U"}
  cap_round_to: {value: 5000, provenance: "Draft: rounded to the nearest $5,000"}
  cpi_base_year: {value: 2026, provenance: "Assumption: the $300,000 is in 2026 dollars and indexing starts from it. Verify with staff."}
  cpi_reference_month: {value: 6, provenance: "Assumption: the draft names CPI-U but not a reference month; June of the prior fiscal year is used. Verify with staff."}
  cpi_forward_rate: {value: 0.027, low: 0.02, high: 0.04, provenance: "Assumption for years after the last BLS observation (CPI-U, U.S. city average, BLS series CUUR0000SA0)"}
  reserve_share: {value: 0.15, provenance: "Draft Sec. 5.5-5(a): 15% of each unrestricted municipal public-art allocation to a restricted Conservation Reserve"}
  exclusions_1989: {value: [land_acquisition, equipment_furniture], provenance: "Ch. 5.5-1 (as quoted in the draft): construction budget shall not include land acquisition costs, equipment or furniture costs"}
  exclusions_draft: {value: [land_acquisition, equipment_furniture, financing, repair_maintenance], provenance: "Draft Sec. 5.5-1 also excludes financing and debt-issuance costs, ordinary repair and maintenance, and expenditures the funding source may not lawfully use for public art"}
  avg_commission: {value: 120000, low: 40000, high: 300000, provenance: "Assumption: typical municipal commission size, used only to convert a pooled balance into a count of possible new works"}
  local_artist_target: {value: 0.15, low: 0.0, high: 0.2, provenance: "Draft Sec. 5.5-4(1)(f) lets the Public Art Master Plan set local-participation goals; 15-20% follows the TRD and Jacksonville Code 126.907 (a local selection goal). Not in the draft as a number."}

impressions:
  view_radius_m:
    value: {small: 25, medium: 60, large: 120, landmark: 200}
    provenance: "Assumption: distance at which a work registers with a passer-by, by scale (small < 2 m, medium 2-5 m, large 5-12 m or a mural, landmark > 12 m or a long wall)"
  glance_tau_s: {value: 4, low: 2, high: 8, provenance: "Assumption: seconds of exposure for a 63% chance of a glance (impression probability 1 - exp(-t/tau))"}
  vehicle_occupancy: {value: 1.5, low: 1.2, high: 1.7, provenance: "Assumption: persons per vehicle (U.S. averages run from about 1.2 on commutes to 1.7 for all trips, NHTS 2017)"}
  salience:
    value: {figure: 0.6, sculpture: 0.7, mural: 0.8, fence: 0.4, wall: 0.7, functional: 0.3}
    provenance: "Assumption: share of exposed passers-by who notice the work, by type"
  ped_radius_factor: {value: {min: 0.5, max: 3, per_m: 0.0167}, provenance: "Assumption: a work seen from farther away reaches passers-by on more of the surrounding streets (factor = clamp(R / 60 m, 0.5, 3))"}
  night:
    value: {lit: 0.85, unlit: 0.1, per_lamp: 0.08, lamp_cap: 0.5, lamp_radius_m: 40}
    provenance: "Assumption: share of daytime visibility after dark: a lit work keeps most; an unlit one depends on streetlights within 40 m (Dark Sky streetlight inventory)"
  attraction:
    value: {scale: {small: 0.2, medium: 0.4, large: 0.65, landmark: 0.9}, lit: 0.1, seating: 0.1, interactive: 0.1}
    provenance: "Assumption: attraction score (0-1) = scale term + lighting + shaded seating + interactivity, capped at 1 (TRD Module 2 'Aesthetic Attraction Score')"
  stop_probability: {value: 0.02, low: 0.005, high: 0.06, provenance: "Assumption: share of passers-by on foot or bike who stop, scaled by the attraction score"}
  dwell_minutes: {value: 2.5, low: 1, high: 6, provenance: "Assumption: minutes per stop at an average work (scaled by 1 + attraction score)"}
  hourly_vehicle:
    value: [0.010, 0.006, 0.005, 0.005, 0.009, 0.021, 0.045, 0.072, 0.068, 0.054, 0.052, 0.056, 0.060, 0.060, 0.062, 0.068, 0.074, 0.077, 0.060, 0.045, 0.036, 0.030, 0.022, 0.015]
    provenance: "Assumption: typical urban weekday hourly share of daily traffic with 7-9 am and 4:30-6:30 pm peaks (shape of FHWA Traffic Monitoring Guide urban profiles)"
  hourly_ped:
    value:
      commute: [0.004, 0.002, 0.001, 0.001, 0.003, 0.012, 0.040, 0.085, 0.080, 0.055, 0.050, 0.060, 0.070, 0.065, 0.058, 0.065, 0.080, 0.085, 0.060, 0.040, 0.030, 0.022, 0.016, 0.008]
      midday: [0.002, 0.001, 0.001, 0.001, 0.001, 0.004, 0.012, 0.030, 0.045, 0.065, 0.085, 0.100, 0.110, 0.110, 0.100, 0.085, 0.070, 0.055, 0.045, 0.030, 0.020, 0.013, 0.010, 0.005]
      night: [0.030, 0.020, 0.010, 0.004, 0.002, 0.002, 0.005, 0.012, 0.018, 0.022, 0.030, 0.045, 0.055, 0.050, 0.045, 0.045, 0.050, 0.060, 0.075, 0.090, 0.100, 0.095, 0.080, 0.055]
    provenance: "Assumption: hourly shares of daily walking/biking for commute-, daytime-culture- and nightlife-dominated places (TRD time windows 07-09/16:30-18:30, 11-15, 19-23)"

roads:
  default_aadt:
    value: {motorway: 60000, trunk: 30000, primary: 18000, secondary: 9000, tertiary: 4000, unclassified: 1500, residential: 500, living_street: 150}
    provenance: "Assumption: typical daily traffic by street class where FDOT has no count (FDOT AADT covers state roads and some county roads)"
  default_mph:
    value: {motorway: 65, trunk: 45, primary: 40, secondary: 35, tertiary: 30, unclassified: 30, residential: 25, living_street: 15, pedestrian: 3, footway: 3, cycleway: 10, path: 3}
    provenance: "Assumption: speeds where OSM has no maxspeed tag (walking 3 mph, cycling 10 mph)"
  aadt_join_m: {value: 30, provenance: "An OSM street piece takes the AADT of the nearest FDOT section within 30 m"}
  piece_m: {value: 200, provenance: "Streets are cut into pieces of at most 200 m"}

pedestrian_model:
  elasticities:
    value: {poi: 0.5, transit: 0.3, pop: 0.3}
    provenance: "Assumption: street flow on foot or bike ~ (1 + destinations within 400 m)^0.5 x (1 + weekday bus departures within 400 m / 100)^0.3 x (1 + residents within 400 m / 1000)^0.3; only the overall scale is fitted, to the City counters that are not on a trail"
  trail_match_m: {value: 4000, provenance: "A trail cell takes the count of the nearest counter on a trail within 4 km; farther trail cells take the median trail count"}
  poi_radius_m: {value: 400}
  transit_radius_m: {value: 400}
  trail_radius_m: {value: 150}
  pop_radius_m: {value: 400}
  no_street_factor: {value: 0.2, provenance: "Assumption: cells without a walkable street or path carry 20% of the modeled flow"}

conservation:
  florida_factor: {value: 1.3, low: 1.0, high: 1.6, provenance: "Assumption: North Florida UV, heat and humidity speed outdoor decay versus temperate climates"}
  value_per_m2_mural: {value: 400, provenance: "Assumption: replacement value of a commissioned exterior mural, $/m2 of wall"}
  replacement_value:
    value: {small: 25000, medium: 75000, large: 150000, landmark: 300000}
    provenance: "Assumption: replacement value by scale when no budget is published (murals use $/m2 instead)"
  materials:
    value:
      bronze:        {decay: 1.5, threshold: 70, intervention: 0.08, routine: 0.005, routine_every: 1}
      steel:         {decay: 2.0, threshold: 70, intervention: 0.10, routine: 0.005, routine_every: 2}
      painted_steel: {decay: 4.0, threshold: 65, intervention: 0.15, routine: 0.01, routine_every: 3}
      glass:         {decay: 1.0, threshold: 75, intervention: 0.10, routine: 0.01, routine_every: 5}
      mosaic:        {decay: 1.0, threshold: 75, intervention: 0.10, routine: 0.02, routine_every: 10}
      acrylic_mural: {decay: 6.0, threshold: 60, intervention: 0.35, routine: 0.05, routine_every: 4}
      concrete:      {decay: 1.2, threshold: 70, intervention: 0.06, routine: 0.01, routine_every: 5}
      stone:         {decay: 0.8, threshold: 70, intervention: 0.05, routine: 0.005, routine_every: 5}
      digital:       {decay: 8.0, threshold: 70, intervention: 0.25, routine: 0.05, routine_every: 1}
      mixed:         {decay: 3.0, threshold: 65, intervention: 0.15, routine: 0.01, routine_every: 3}
    provenance: "Assumption (replace with a conservator's condition survey): condition points lost per year before the Florida factor; intervention when condition falls below the threshold, costing a share of replacement value and restoring condition to 90; routine care as a share of value every N years"
  start_condition: {value: 85, provenance: "Assumption: condition of existing works today (0-100); new works start at 100"}

equity:
  walk_radius_m: {value: 804.67, provenance: "Half a mile, a common walk-access standard (e.g. park access in the ParkScore methodology)"}
  low_income_ratio: {value: 0.8, provenance: "A block group is low-income when its median household income is below 80% of the county median (HUD's 80% of area median income, applied to block-group medians)"}
  east_divide_lon: {value: -82.3249, provenance: "Simplified definition: East Gainesville = inside city limits and east of Main Street, the usual divide in City planning (e.g. the GCRA Eastside area). The GCRA boundary is a separate overlay."}
  gap_weight_low_income: {value: 1.0, provenance: "Allocator weight on uncovered residents of low-income block groups (added to 1)"}
  gap_weight_east: {value: 1.0, provenance: "Allocator weight on uncovered residents of East Gainesville (added to 1)"}

economics:
  aep6:
    value:
      total_activity: 189462764
      organizations: 49600000
      audiences: 139900000
      jobs: 2992
      tax_local: 5990232
      tax_state: 6661188
      tax_federal: 20496713
      attendance: 2483566
      share_nonlocal: 0.573
      spend_nonlocal: 76.48
      spend_local: 29.26
      spend_all: 56.33
      pride: 0.868
    provenance: "Americans for the Arts, Arts & Economic Prosperity 6, Alachua County one-page summary (2023), files.floridados.gov/media/707143. Sector-wide annual figures for arts events, shown as context only; the TRD's $20,496,713 'total tax' is the federal line."
  share_nonlocal: {value: 0.2, low: 0.05, high: 0.573, provenance: "Assumption: non-local share of people who come for a public artwork; AEP6's 57.3% (ticketed arts events) is the upper bound"}
  incremental_visit_share: {value: 0.1, low: 0.02, high: 0.25, provenance: "Assumption: share of stops that are new trips made because of the work (the rest would have passed anyway)"}
  destination_visits:
    value: {small: 0, medium: 500, large: 3000, landmark: 15000}
    provenance: "Assumption: extra visits per year drawn by a work as a destination, by scale"
  realisation: {value: 0.25, low: 0.1, high: 0.6, provenance: "Assumption: spending per art visit relative to AEP6 per-attendee spending at arts events (a mural stop is shorter than an event)"}
  overnight_share: {value: 0.05, low: 0.0, high: 0.2, provenance: "Assumption: share of non-local art visitors who stay overnight because of the visit"}
  persons_per_room: {value: 2.0, low: 1.5, high: 2.5, provenance: "Assumption (not published locally)"}
  adr: {value: 134.29, provenance: "Derived: Visit Gainesville 2025 reports $9.4M tourist development tax and 1.4M room nights; $9.4M / 5% / 1.4M = $134 per room night"}
  tdt_rate: {value: 0.05, provenance: "Alachua County Tourist Development Tax, 5% (Alachua County Tax Collector)"}
  retail_lift: {value: 0.01, low: 0.0, high: 0.03, provenance: "Assumption: sales change at shops and restaurants within 500 ft of a new landmark work; shown as a range, not in headline totals"}
  sales_per_establishment: {value: 900000, provenance: "Assumption: annual sales per restaurant/shop near downtown, for the retail-lift range only"}

staff_study:
  ch30_options:
    value: {A: {label: "On-site art", rate: 0.01}, B: {label: "Off-site art within 1 mile", rate: 0.01}, C: {label: "In-lieu payment to the trust", rate: 0.0075}}
    provenance: "TRD Sub-Module 3.4 (hypothetical). The Trust handout leaves any Chapter 30 incentive to staff/legal study."
  ch30_bonus_caps: {value: {far: 0.25, stories: 1, parking: 0.2}, provenance: "TRD Sub-Module 3.4 (hypothetical caps)"}
  ch30_uptake: {value: 0.25, low: 0.0, high: 0.8, provenance: "Assumption: share of eligible private projects that would opt in"}
  ch30_private_construction: {value: 250000000, low: 100000000, high: 500000000, provenance: "Assumption: eligible private construction value per year in the City (replace with permit data)"}
  ch30_land_value_per_buildable_sf: {value: 35, provenance: "Assumption: value to a developer of one extra buildable square foot (for the bonus-vs-pledge comparison)"}
  gru_nexus:
    value: ["Aesthetic mitigation of utility infrastructure", "Artist-designed utility enclosures", "Resource-conservation education art on utility property"]
    provenance: "TRD Sub-Module 3.5 (hypothetical checklist). The handout: determine GRU applicability and lawful use with the City Attorney and GRU counsel."
  interlocal:
    value: {manager_cost: 115000, conservator_cost: 60000, separate_overhead: 0.15, shared_overhead: 0.08, shared_capacity: 1.25, split: population}
    provenance: "Assumption: loaded annual cost of a public art program manager and a contract conservator; overhead shares and the 25% extra capacity a shared program needs are planning guesses. The handout lists City-County coordination for separate study."
  populations: {value: {city: 145000, county_unincorporated: 110000}, provenance: "Approximate (Census 2020: Gainesville 141,085; Alachua County 278,468)"}

facilities:
  expansion_min_sqft: {value: 1000, low: 500, high: 5000, provenance: "Assumption: the smallest increase in a parcel's recorded building area counted as an expansion (filters re-measurement noise)"}
  expansion_min_share: {value: 0.10, provenance: "Assumption: an expansion also adds at least 10% to the previous building area"}
  state_rule:
    value: {rate: 0.005, cap: 100000, applies_to: "original construction of a state building which provides public access"}
    provenance: "s. 255.043(1), Florida Statutes (Art in State Buildings): up to 0.5 percent of the total construction appropriation, not to exceed $100,000; renovations and additions are not covered. https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0200-0299/0255/Sections/0255.043.html"
  county_rule:
    value: null
    provenance: "No Alachua County percent-for-art ordinance was found; the County Arts Council page names no funding rule, and County works (Sankofa, Bounce) were budgeted project by project. Verify with the Arts Council."
  city_rule_note: {value: "Gainesville Ch. 5.5 (policy.allocation_rate and the cap of the selected code version) for buildings owned by the City or GRU; other cities' programs are not modelled", provenance: "Ch. 5.5-3(c)"}

sources:
  - "Gainesville Code of Ordinances, Chapter 5.5 Art in Public Places (Municode)"
  - "Art in Public Places Trust, Priorities for Modernizing Chapter 5.5, agenda discussion handout, Aug 31 2026"
  - "Americans for the Arts, AEP6 Alachua County summary (2023)"
  - "BLS CPI-U, series CUUR0000SA0"
  - "Census Reporter, ACS 2020-2024 5-year B19013"
  - "City of Gainesville ArcGIS Online: GCRA boundary and priority areas, zoning (Jan 2025), bicycle/pedestrian counts 2025"
  - "FDOT annual average daily traffic; OpenStreetMap (ODbL); RTS GTFS"
  - "Visit Gainesville visitor revenue statistics (2025); Alachua County Tax Collector (TDT 5%)"
  - "Section 255.043, Florida Statutes (Art in State Buildings); Alachua County parcel layers 2001-2024; FL DOR 2025 parcel roll (FGIO)"
