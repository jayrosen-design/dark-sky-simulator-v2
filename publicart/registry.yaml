# Public art registry: Gainesville and Alachua County, Florida
#
# HAND-COMPILED from public web sources on 2026-10-03.
# This is NOT the City of Gainesville's or Alachua County's official inventory;
# neither publishes a machine-readable one. Each entry cites the page that
# supports it (source_url). Unknown values are null. Uncertainty is in `notes`.
#
# Sources used: gainesvillefl.gov, alachuacounty.us, ufl.edu pages, Alachua
# Chronicle, WCJB, WUFT, Mainstreet Daily News, Gainesville Sun (via syndicated
# copies), Visit Gainesville, guidetogreatergainesville.com, Monochronicle
# (the Alachua County Arts Council's call-for-artists platform), and the
# OpenStreetMap Overpass API (tourism=artwork in bbox 29.58,-82.47,29.76,-82.20).
# Works listed in the Public Art Archive are in registry_paa.yaml (facts only);
# three that were already here cite their archive record in extra_sources.
# Entries here have no `setting` field and are treated as outdoor works.
#
# Conventions:
# - lon/lat are given ONLY where an OSM node/way supplies them (5 decimals);
#   every other entry is address/location_note only.
# - status "existing" for older murals means "last reported in place in the
#   cited source"; murals were not re-checked in person. See notes.
# - provenance follows the categories in the request; null = none of the
#   categories fits or it could not be determined (explained in notes).
# - material null = not stated in any source used.

