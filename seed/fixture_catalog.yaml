# Lighting-solution catalog for the Build tab. Generic fixture TYPES that meet DarkSky Approved criteria (fully
# shielded or visor-controlled, <= 3000K), not specific products: DarkSky's searchable list
# (https://darksky.org/what-we-do/darksky-approved/darksky-approved-luminaires-program/luminaires/) publishes no
# prices, and product photos are manufacturers' copyright, so each card links to the official search instead.
#
# slot: which existing fixture stock a card replaces (street = public streetlights; commercial, residential and
#       sports = the private and sports stocks). One card per slot is equipped at a time.
# unit_cost: installed USD per fixture. provenance: corpus (PRD 6.4), web_survey (retail price seen 2026-09-26, plus
#       the corpus truck-roll install allowance), derived, or design_assumption. Estimates, not quotes.
version: 2.0.0
darksky_search_url: "https://darksky.org/what-we-do/darksky-approved/darksky-approved-luminaires-program/luminaires/"
install_allowance: {value: 200, provenance: corpus, ref: "PRD 6.4 truck roll $200 (range $150-250)"}
categories:
  street:      {label: "Street lights", icon: cobra}
  decorative:  {label: "Decorative & pedestrian", icon: posttop}
  commercial:  {label: "Commercial & parking", icon: shoebox}
  residential: {label: "Residential", icon: porch}
  sports:      {label: "Sports & stadium", icon: sports}
  wildlife:    {label: "Wildlife-friendly", icon: amber}
